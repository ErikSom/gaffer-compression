<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Gaffer Compression — split view</title>
	<style>
		html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
		.grid { display: grid; grid-template-columns: 1fr 1fr; height: 100vh; gap: 2px; background: #222; }
		iframe { width: 100%; height: 100%; border: 0; display: block; }
		.label { position: fixed; top: 8px; font-family: ui-monospace, monospace; font-size: 11px; color: #fff; background: rgba(0,0,0,.6); padding: 3px 8px; border-radius: 4px; pointer-events: none; z-index: 10; }
		.label.left { left: 8px; }
		.label.right { left: calc(50% + 8px); }
	</style>
</head>
<body>
	<div class="label left">client A</div>
	<div class="label right">client B</div>
	<div class="grid">
		<iframe src="./index.html" allow="autoplay"></iframe>
		<iframe src="./index.html" allow="autoplay"></iframe>
	</div>
</body>
</html>
